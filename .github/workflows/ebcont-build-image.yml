# EBCONT fork: test and build the connectors image, push it to GitHub Container Registry.
#
# - Pull request into ebcont/8.17 -> tests + image build (no push)
# - Push to ebcont/8.17            -> tests + push :8.17-ebcont and :sha-<commit>
# - Git tag v8.17.1-ebcont.<n>     -> tests + push :8.17.1-ebcont.<n>  (use this tag in docker-compose)
name: EBCONT build image

on:
  pull_request:
    branches: ["ebcont/8.17"]
  push:
    branches: ["ebcont/8.17"]
    tags: ["v*-ebcont.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests (Confluence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements/x86_64.txt -r requirements/tests.txt
          pip install -e . --no-deps
      - name: Run Confluence tests
        run: python -m pytest tests/sources/test_confluence.py tests/sources/test_confluence_markdown.py -q

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (ghcr requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/elastic-connectors" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=8.17-ebcont,enable=${{ github.ref == 'refs/heads/ebcont/8.17' }}
            type=sha
            type=match,pattern=v(.*),group=1

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ebcont
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
